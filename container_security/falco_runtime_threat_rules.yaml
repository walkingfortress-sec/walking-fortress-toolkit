# ============================================================================
# Walking Fortress - Falco Container Runtime Detection Rules
# Target: Kubernetes Pods & Docker Containers
# MITRE ATT&CK Container Matrix: T1059.004, T1003.008
# ============================================================================

- rule: Interactive Shell Spawned in Container
  desc: Detects interactive shell execution (bash, sh, zsh) inside a running container instance.
  condition: >
    spawned_process and 
    container and 
    proc.name in (bash, sh, zsh, ksh) and 
    proc.tty != 0 and 
    not user_known_shell_spawn_activities
  output: >
    [CRITICAL] Walking Fortress Container Alert: Interactive shell spawned in container 
    (user=%user.name container_id=%container.id container_name=%container.name 
    image=%container.image.repository process=%proc.name parent=%proc.pname cmdline=%proc.cmdline)
  priority: CRITICAL
  tags: [container, mitre_execution, T1059.004]

- rule: Sensitive File Read in Container
  desc: Detects attempts to read credential or system configuration files inside a container.
  condition: >
    open_read and 
    container and 
    fd.name in (/etc/shadow, /etc/passwd, /var/run/secrets/kubernetes.io/serviceaccount/token)
  output: >
    [WARNING] Walking Fortress Container Alert: Sensitive file read attempt inside container 
    (user=%user.name file=%fd.name container_id=%container.id image=%container.image.repository)
  priority: WARNING
  tags: [container, mitre_credential_access, T1003.008]