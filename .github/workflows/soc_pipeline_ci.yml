name: Walking Fortress SOC Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f tests/test_requirements.txt ]; then pip install -r tests/test_requirements.txt; fi

    - name: Run SIEM Detection Rule Regression Suite
      run: |
        python tests/siem_rule_regression_runner.py

    - name: Run E2E Incident Response Simulator
      run: |
        python tests/e2e_ir_pipeline_simulator.py